name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install JS dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check src tests alembic

      - name: Ruff format
        run: uv run ruff format --check src tests alembic

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src -q

      - name: Yamllint
        run: uv run yamllint .

      - name: Codespell
        run: uv run codespell --toml pyproject.toml .

      # Pygments CVE-2026-4539: убрать --ignore-vuln после выхода исправления в PyPI.
      - name: pip-audit
        run: uv run pip-audit --timeout 120 --ignore-vuln CVE-2026-4539

      - name: Mypy
        run: uv run mypy src

      - name: Pytest with coverage
        run: uv run pytest -q --cov=src --cov-report=term --cov-fail-under=85

      - name: Pre-commit (остальные хуки; Ruff уже выше)
        env:
          SKIP: ruff-check,ruff-format
        run: uv run pre-commit run --all-files
