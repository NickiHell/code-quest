# Установка: uv sync --group dev && uv run pre-commit install
# Сообщения коммитов: Conventional Commits (см. Commitizen / хук commit-msg).

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "src"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--toml, pyproject.toml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      # Pygments CVE-2026-4539: убрать --ignore-vuln после выхода исправленной версии в PyPI.
      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit --timeout 120 --ignore-vuln CVE-2026-4539
        language: system
        pass_filenames: false
        always_run: true
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        files: ^static/.*\.js$
        types: [file]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
