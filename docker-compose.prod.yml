services:
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://codequest:codequest@db:5432/codequest
      POOL_MODE: session
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
    depends_on:
      db:
        condition: service_healthy
    networks:
      - codequest

  api:
    build: .
    env_file: .env
    environment:
      PYTHONPATH: /app
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      pgbouncer:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - codequest_logs:/app/logs
    networks:
      - codequest

  celery_worker:
    build: .
    command:
      [
        "celery",
        "-A",
        "src.infrastructure.celery_app",
        "worker",
        "--loglevel=info",
        "-Q",
        "codequest",
      ]
    env_file: .env
    environment:
      PYTHONPATH: /app
      APP_ENV: production
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - codequest_logs:/app/logs
    networks:
      - codequest

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codequest
      POSTGRES_PASSWORD: codequest
      POSTGRES_DB: codequest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - codequest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codequest"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - codequest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  codequest:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  codequest_logs:
