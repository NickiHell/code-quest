[project]
name = "code-quest"
version = "0.1.0"
description = "Telegram Mini App for programming tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "aiogram>=3.15.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "alembic>=1.14.0",
    "docker>=7.1.0",
    "loguru>=0.7.3",
    "yandex-ai-studio-sdk>=0.19.2",
    "openai>=2.29.0",
    "celery[redis]>=5.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "mypy>=1.13.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "types-redis>=4.6.0",
    "asgi-lifespan>=2.1.0",
    "pre-commit>=4.5.1",
    "commitizen>=4.13.9",
    "pytest-cov>=7.1.0",
    "bandit[toml]>=1.8.0",
    "yamllint>=1.38.0",
    "codespell>=2.4.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "ANN",
    "ARG",
    "B",
    "BLE",
    "C90",
    "PIE",
    "PLR",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "TRY",
]
ignore = [
    "ANN401",
    "RUF001",
    "RUF002",
    "RUF003",
    "TRY003",
    "EM101",
    "EM102",
]

[tool.ruff.lint.per-file-ignores]
"alembic/**/*.py" = ["ANN", "PLR"]
"src/infrastructure/ai/factory.py" = ["BLE001"]
"src/interfaces/api/deps.py" = ["ANN", "B008"]
"src/interfaces/api/routes/**/*.py" = ["ANN", "B008"]
"src/interfaces/api/routes/health.py" = ["BLE001"]
"src/interfaces/bot/loader.py" = ["BLE001"]
"src/main.py" = ["PLR0915"]
"src/infrastructure/tasks/jobs.py" = ["ANN001"]
"tests/conftest.py" = ["E402"]
"tests/**/*.py" = [
    "ANN",
    "ARG001",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "S101",
    "S105",
    "S106",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-returns = 7
max-statements = 55

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
strict_equality = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "src.infrastructure.tasks.jobs"
disable_error_code = ["untyped-decorator", "no-untyped-def"]

[[tool.mypy.overrides]]
module = [
    "aiogram.*",
    "docker.*",
    "loguru",
    "yandex_ai_studio_sdk",
    "yandex_ai_studio_sdk.*",
    "openai",
    "openai.*",
    "celery",
    "celery.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"

[tool.bandit]
exclude_dirs = [".venv", "venv", "tests", "alembic/versions"]

[tool.codespell]
skip = ".git,.venv,node_modules,uv.lock,package-lock.json,logs,.history,*.min.js,*.map"
ignore-words-list = "resultIn"
