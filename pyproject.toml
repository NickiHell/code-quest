[project]
name = "code-quest"
version = "0.1.0"
description = "Telegram Mini App for programming tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "aiogram>=3.15.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "alembic>=1.14.0",
    "docker>=7.1.0",
    "loguru>=0.7.3",
    "yandex-ai-studio-sdk>=0.19.2",
    "openai>=2.29.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "mypy>=1.13.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "types-redis>=4.6.0",
    "asgi-lifespan>=2.1.0",
    "pre-commit>=4.5.1",
    "commitizen>=4.13.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["aiogram.*", "docker.*", "loguru", "yandex_ai_studio_sdk", "yandex_ai_studio_sdk.*", "openai", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# Commitizen: интерактивные коммиты — `cz commit` (Conventional Commits)
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
